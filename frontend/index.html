<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Niraum Metals — Strength Forged For Generations</title>
    <meta
      name="description"
      content="Niraum Metals Pvt. Ltd. — iron ore, metal minerals and stone/aggregate supply in Nepal."
    />
    <!-- Apply saved theme before paint to avoid a flash (see ThemeProvider). -->
    <script>
      try {
        var t = localStorage.getItem('niraum-theme') || 'system';
        var d =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
