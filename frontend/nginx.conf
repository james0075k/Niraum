server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API reverse proxy keeps cookies same-origin (SameSite=Strict).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Dynamic slugs not prerendered yet (e.g. new jobs) → that language's app shell.
  location ~ ^/(en|ne)/(careers|projects|news)/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /$1/index.html;
  }

  # Client-only app (admin) and pre-4.5 unprefixed slugs → app shell (/index.html redirects
  # unprefixed public paths to /<lang>/…; it leaves /admin alone).
  location ~ ^/(admin|careers/|projects/|news/) {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }

  # Prerendered pages (nested dirs); anything else is a real 404 with the branded page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404/index.html;
}
