server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API reverse proxy keeps cookies same-origin (SameSite=Strict).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Retired pre-4.5 sections (frontend/src/app/redirects.ts) → closest new page, permanently.
  location ~ ^/(en|ne)/operations(/.*)?$ { return 301 /$1/products; }
  location ~ ^/(en|ne)/projects(/.*)?$ { return 301 /$1/our-project; }
  location ~ ^/(en|ne)/news(/.*)?$ { return 301 /$1/about; }
  location ~ ^/(en|ne)/careers(/.*)?$ { return 301 /$1/contact; }
  location ~ ^/operations(/.*)?$ { return 301 /en/products; }
  location ~ ^/projects(/.*)?$ { return 301 /en/our-project; }
  location ~ ^/news(/.*)?$ { return 301 /en/about; }
  location ~ ^/careers(/.*)?$ { return 301 /en/contact; }

  # Client-only app (admin) → app shell (/index.html leaves /admin alone).
  location ~ ^/admin {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }

  # Prerendered pages (nested dirs); anything else is a real 404 with the branded page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404/index.html;
}
